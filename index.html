<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Musical Interval Calculator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Ubuntu+Mono&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Ubuntu Mono', monospace;
            margin: 40px;
            color: #333;
        }

        .dropdown-container {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        select {
            font-family: 'Ubuntu Mono', monospace;
            font-size: 16px;
            padding: 4px;
            width: auto;
            text-align: center;
        }

        .plus {
            font-size: 18px;
            font-weight: bold;
        }

        #output-box {
            border: 1px solid #999;
            padding: 20px;
            min-height: 50px;
            width: fit-content;
            min-width: 300px;
            white-space: pre-line; /* Allows \n to act as line breaks */
            font-size: 18px;
            line-height: 1.6;
        }
    </style>
</head>
<body>

    <div class="dropdown-container" id="dropdowns">
        <!-- 5 Dropdowns generated by JS for cleaner HTML, separated by + -->
    </div>

    <div id="output-box"></div>

    <script>
        // Interval data map
        const intervals = [
            { name: "---", value: "" },
            { name: "P1", value: 0 },
            { name: "m2", value: 1 },
            { name: "M2", value: 2 },
            { name: "m3", value: 3 },
            { name: "M3", value: 4 },
            { name: "P4", value: 5 },
            { name: "A4/d5", value: 6 },
            { name: "P5", value: 7 },
            { name: "m6", value: 8 },
            { name: "M6", value: 9 },
            { name: "m7", value: 10 },
            { name: "M7", value: 11 },
            { name: "P8", value: 12 }
        ];

        // The exact names to pull from when converting sum back to interval
        const intervalNames = ['P1', 'm2', 'M2', 'm3', 'M3', 'P4', 'A4/d5', 'P5', 'm6', 'M6', 'm7', 'M7'];

        // Setup UI
        const container = document.getElementById('dropdowns');
        
        for (let i = 0; i < 5; i++) {
            let select = document.createElement('select');
            select.className = "interval-select";
            
            intervals.forEach(int => {
                let option = document.createElement('option');
                option.value = int.value;
                option.textContent = int.name;
                select.appendChild(option);
            });

            // Trigger calculation on any change
            select.addEventListener('change', calculate);
            container.appendChild(select);

            // Add plus signs between selects
            if (i < 4) {
                let plus = document.createElement('span');
                plus.className = "plus";
                plus.textContent = "+";
                container.appendChild(plus);
            }
        }

        // Calculation logic
        function calculate() {
            const selects = document.querySelectorAll('.interval-select');
            let sequence = [];
            
            // 1. Gather inputs, filtering out blanks (left to right order remains intact)
            selects.forEach(select => {
                if (select.value !== "") {
                    sequence.push(parseInt(select.value, 10));
                }
            });

            let out1 = ["R"];
            let cumulativeTotal = 0;

            // 2. Calculate running totals and convert back to intervals
            for (let num of sequence) {
                cumulativeTotal += num;
                
                // Edge case: if exact 12, label it P8 as per chart, otherwise wrap around 12
                let intervalName = (cumulativeTotal === 12) ? "P8" : intervalNames[cumulativeTotal % 12];
                out1.push(intervalName);
            }

            // 3. Scale Degree formatting (Second output)
            let out2 = out1.map(int => {
                if (int === "R") return "1";
                
                // Swap letters according to the rules
                return int
                    .replace(/M/g, '')
                    .replace(/P/g, '')
                    .replace(/m/g, 'b')
                    .replace(/A/g, '#')
                    .replace(/8/g, '1')
                    .replace(/d/g, 'b');
            });

            // 4. Print Outputs
            const outputBox = document.getElementById('output-box');
            outputBox.textContent = out1.join(', ') + '\n' + out2.join(' ');
        }

        // Run calculation once on load to populate the initial "R \n 1" text
        calculate();
    </script>
</body>
</html>
