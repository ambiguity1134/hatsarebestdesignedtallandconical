<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Musical Interval Calculator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Ubuntu+Mono&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Ubuntu Mono', monospace;
            margin: 40px;
            color: #333;
        }

        .dropdown-container {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        select {
            font-family: 'Ubuntu Mono', monospace;
            font-size: 16px;
            padding: 4px;
            width: auto;
            text-align: center;
        }

        .plus {
            font-size: 18px;
            font-weight: bold;
        }

        #output-box {
            border: 1px solid #999;
            padding: 20px;
            min-height: 70px;
            width: fit-content;
            min-width: 300px;
            font-size: 18px;
            line-height: 1.6;
        }

        .diatonic-yes {
            color: green;
        }

        .diatonic-no {
            color: red;
        }
    </style>
</head>
<body>

    <div class="dropdown-container" id="dropdowns">
        <!-- Dropdowns generated by JS -->
    </div>

    <div id="output-box"></div>

    <script>
        const intervals = [
            { name: "---", value: "" },
            { name: "P1", value: 0 },
            { name: "m2", value: 1 },
            { name: "M2", value: 2 },
            { name: "m3", value: 3 },
            { name: "M3", value: 4 },
            { name: "P4", value: 5 },
            { name: "A4/d5", value: 6 },
            { name: "P5", value: 7 },
            { name: "m6", value: 8 },
            { name: "M6", value: 9 },
            { name: "m7", value: 10 },
            { name: "M7", value: 11 },
            { name: "P8", value: 12 }
        ];

        const intervalNames = ['P1', 'm2', 'M2', 'm3', 'M3', 'P4', 'A4/d5', 'P5', 'm6', 'M6', 'm7', 'M7'];

        // The 7 Major scale modes mapped to our output formats 
        // (#4 and b5 are mapped to "#4/b5" to match the string replacements below)
        const modes = [
            ["1", "2", "3", "4", "5", "6", "7", "8"],          // Ionian
            ["1", "2", "b3", "4", "5", "6", "b7", "8"],        // Dorian
            ["1", "b2", "b3", "4", "5", "b6", "b7", "8"],      // Phrygian
            ["1", "2", "3", "#4/b5", "5", "6", "7", "8"],      // Lydian
            ["1", "2", "3", "4", "5", "6", "b7", "8"],         // Mixolydian
            ["1", "2", "b3", "4", "5", "b6", "b7", "8"],       // Aeolian
            ["1", "b2", "b3", "4", "#4/b5", "b6", "b7", "8"]   // Locrian
        ];

        const container = document.getElementById('dropdowns');
        
        for (let i = 0; i < 5; i++) {
            let select = document.createElement('select');
            select.className = "interval-select";
            
            intervals.forEach(int => {
                let option = document.createElement('option');
                option.value = int.value;
                option.textContent = int.name;
                select.appendChild(option);
            });

            select.addEventListener('change', calculate);
            container.appendChild(select);

            if (i < 4) {
                let plus = document.createElement('span');
                plus.className = "plus";
                plus.textContent = "+";
                container.appendChild(plus);
            }
        }

        function calculate() {
            const selects = document.querySelectorAll('.interval-select');
            let sequence = [];
            
            selects.forEach(select => {
                if (select.value !== "") {
                    sequence.push(parseInt(select.value, 10));
                }
            });

            let out1 = ["R"];
            let cumulativeTotal = 0;

            for (let num of sequence) {
                cumulativeTotal += num;
                let intervalName = (cumulativeTotal === 12) ? "P8" : intervalNames[cumulativeTotal % 12];
                out1.push(intervalName);
            }

            let out2 = out1.map(int => {
                if (int === "R" || int === "P8") return "1";
                return int
                    .replace(/M/g, '')
                    .replace(/P/g, '')
                    .replace(/m/g, 'b')
                    .replace(/A/g, '#')
                    .replace(/d/g, 'b');
            });

            // Determine if diatonic
            let isDiatonic = false;
            
            for (let mode of modes) {
                let isMatch = true;
                for (let degree of out2) {
                    if (!mode.includes(degree)) {
                        isMatch = false;
                        break;
                    }
                }
                if (isMatch) {
                    isDiatonic = true;
                    break;
                }
            }

            // Create Diatonic text output
            let diatonicOutput = isDiatonic 
                ? 'Diatonic: <span class="diatonic-yes">YES</span>' 
                : 'Diatonic: <span class="diatonic-no">NO</span>';

            const outputBox = document.getElementById('output-box');
            outputBox.innerHTML = `${out1.join(', ')}<br>${out2.join(' ')}<br>${diatonicOutput}`;
        }

        calculate();
    </script>
</body>
</html>
